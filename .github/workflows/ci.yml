name: CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Python 3.9 retire : les dependances exigent >= 3.10 (cf. main.yml).
        python-version: ["3.10", "3.11", "3.12"]

    services:
      redis:
        image: redis
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,test]"
        
    - name: Lint with black (indicatif)
      # Le formatage n'a jamais ete applique au depot : cette etape reste
      # informative tant qu'un passage global de black/isort n'a pas ete fait.
      continue-on-error: true
      run: |
        black . --check
        
    - name: Check imports with isort (indicatif)
      continue-on-error: true
      run: |
        isort . --check-only --diff
        
    - name: Type check with mypy (indicatif)
      continue-on-error: true
      run: |
        mypy sadie/
        
    - name: Run tests
      run: |
        pytest tests/ --cov=sadie --cov-report=xml
        
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        # N'echoue pas la chaine si Codecov est injoignable.
        fail_ci_if_error: false
        
  benchmark:
    needs: test
    runs-on: ubuntu-latest
    # Désactivé : les tests de charge ont été déplacés dans tests/legacy/stress/
    # (ils visent des collecteurs qui n'existent plus) et pytest-benchmark n'est
    # pas installé par les extras du projet. À réactiver après avoir traité
    # tests/legacy/README.md.
    if: false
    
    services:
      redis:
        image: redis
        ports:
          - 6379:6379
          
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"
        
    - name: Install dependencies
      run: |
        pip install -e ".[test]"
        
    - name: Run benchmarks
      run: |
        pytest tests/stress/ --benchmark-only
        
  deploy-docs:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    # peaceiris/actions-gh-pages publie sur la branche gh-pages.
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"
        
    - name: Install dependencies
      run: |
        pip install -e ".[docs]"
        
    - name: Build docs
      run: |
        mkdocs build
        
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./site 