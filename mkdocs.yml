site_name: sadie
site_description: Advanced Trading Data Collection and Analysis System
site_author: papierfroisse
repo_url: https://github.com/papierfroisse/SADIE
repo_name: sadie

theme:
  name: material
  palette:
    scheme: slate
    primary: indigo
    accent: deep purple
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.annotate
    - content.code.copy

markdown_extensions:
  - admonition
  - codehilite
  - footnotes
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          # `paths` remplace l'ancien `setup_commands` (supprime dans
          # mkdocstrings-python 2) : le projet n'etant pas installe dans le
          # workflow de documentation, il doit etre importable depuis la racine.
          paths:
            - .
          options:
            members: true
            show_source: true
            show_if_no_docstring: true

nav:
  - Accueil: index.md
  - Installation: user-guide/installation.md
  - Modules:
      - Collecteurs: collectors.md
      - Stockage: models.md
      - Analyse Technique: analysis.md
      - Métriques: metrics.md
      - Surveillance: development/monitoring.md
  - Exemples: examples.md
  - Référence API:
      - Vue d'ensemble: api/README.md
      - Analyse: api/analysis.md
      - Métriques: api/metrics.md
  - Contribution: development/contributing.md 